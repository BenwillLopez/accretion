name: Host builds

# Copies Accretion's own builds (Accretion Mods, the Accretion app) into the private Supabase
# bucket that the download function serves. Every 12 hours and on manual runs.
on:
  schedule:
    - cron: "41 */12 * * *"
  workflow_dispatch:

concurrency:
  group: host-builds
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Copy new builds into the private bucket
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python scripts/host_builds.py
