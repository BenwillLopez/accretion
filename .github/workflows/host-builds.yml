name: "Store: copy app builds"

# Copies Accretion's own builds (Accretion Mods, the Accretion app) into the private Supabase
# bucket that the download function serves, for a build the release workflows failed to upload.
# Manual runs only: a scheduled copy would turn anything listed on either repo's main branch
# into "Accretion's own build" with nobody looking, and the script only hosts a build whose
# sha256 the source declares and the file matches.
on:
  workflow_dispatch:

concurrency:
  group: host-builds
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Copy new builds into the private bucket
        id: copy-builds
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/host_builds.py | tee host-builds.txt
      - name: Summary
        if: always()
        env:
          STEPS: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
        run: |
          failed=$(jq -r 'to_entries | map(select(.value.conclusion == "failure") | .key | gsub("-"; " ")) | join(", ")' <<< "$STEPS")
          {
            if [ "$JOB_STATUS" = success ]; then
              echo "### App builds copied to the private bucket"
            else
              echo "### Copying the app builds failed"
              echo "Failed step: ${failed:-unknown}. A bad or expired SUPABASE_ACCESS_TOKEN is the usual cause: check that secret, then run this workflow again."
            fi
            echo
            echo "| Step | Result |"
            echo "| --- | --- |"
            jq -r 'to_entries[] | "| " + (.key | gsub("-"; " ")) + " | " + (.value.conclusion // "not run") + " |"' <<< "$STEPS"
            echo
            echo "| Fact | Value |"
            echo "| --- | --- |"
            echo "| Result | $(tail -n 1 host-builds.txt 2> /dev/null || echo no output) |"
          } >> "$GITHUB_STEP_SUMMARY"
