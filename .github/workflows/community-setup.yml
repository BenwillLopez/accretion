name: Set up community

# One click: creates (or reuses) the Supabase project, applies supabase/schema.sql, points
# sign-in links at the store, saves the public URL + key to supabase/project.json, then
# rebuilds the store. Run it again with your username after signing up to become admin.
# Needs the SUPABASE_ACCESS_TOKEN repository secret (supabase.com/dashboard/account/tokens).
on:
  # monthly: re-signs the Apple sign-in key (Apple allows 6 months at most) and re-checks setup
  schedule:
    - cron: "23 5 1 * *"
  workflow_dispatch:
    inputs:
      admin_username:
        description: "Make this store username an admin (sign up first; leave empty on the first run)"
        required: false
        default: ""
      region:
        description: "Where to host the database (pick the one closest to most users)"
        type: choice
        default: us-east-1
        options: [us-east-1, us-east-2, us-west-1, sa-east-1, eu-west-1, eu-west-2, eu-central-1, ap-southeast-1, ap-northeast-1, ap-south-1]
      prune_supabase:
        description: "Prune: remove Supabase fallback copies older than each app's newest 5 (they stay in S3)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  setup:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_APPLE_KEY: ${{ secrets.APPLE_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - name: Install Apple key signing
        if: env.HAS_APPLE_KEY == 'true'
        run: pip install "pyjwt[crypto]==2.9.0"
      - name: Create and configure the Supabase project
        run: python scripts/supabase_setup.py
        env:
          # sign-in providers: each one switches on when its secrets are set (see supabase/README.md)
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GH_OAUTH_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          GH_OAUTH_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          # or one secret per provider holding both the client ID and the secret
          GOOGLE_KEYS: ${{ secrets.GOOGLE }}
          GIT_KEYS: ${{ secrets.GIT }}
          DISCORD_KEYS: ${{ secrets.DISCORD }}
          # mail account for sign-up and password emails (see supabase/README.md)
          SMTP: ${{ secrets.SMTP }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          APPLE_SERVICES_ID: ${{ secrets.APPLE_SERVICES_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SITE_URL: ${{ steps.pages.outputs.base_url && format('{0}/', steps.pages.outputs.base_url) || '' }}
          SUPABASE_REGION: ${{ inputs.region || 'us-east-1' }}
          ADMIN_USERNAME: ${{ inputs.admin_username }}
      # Accretion-hosted builds: download (login or personal key), personal sources, and upload
      # (release workflows put new builds in the private bucket with ACCRETION_UPLOAD_KEY).
      # --no-verify-jwt: AltStore and friends call with a key, not a login; the functions check it.
      # Builds on AWS (aws/builds-cdn.yaml): switches on when the BUILDS_* and CDN_* secrets and
      # variables are set. Every build is kept in both stores first: CloudFront serves from S3, and
      # the download function falls back to Supabase if AWS is unavailable.
      - name: Keep hosted builds in S3 and Supabase
        if: vars.BUILDS_BUCKET != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BUILDS_BUCKET: ${{ vars.BUILDS_BUCKET }}
          BUILDS_REGION: ${{ vars.BUILDS_REGION }}
          BUILDS_AWS_KEY_ID: ${{ secrets.BUILDS_AWS_KEY_ID }}
          BUILDS_AWS_SECRET: ${{ secrets.BUILDS_AWS_SECRET }}
          PRUNE_SUPABASE: ${{ inputs.prune_supabase }}
        run: |
          pip install "boto3==1.43.111"
          python scripts/copy_builds_to_s3.py
      - name: Deploy download functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          UPLOAD_KEY: ${{ secrets.ACCRETION_UPLOAD_KEY }}
          BUILDS_BUCKET: ${{ vars.BUILDS_BUCKET }}
          BUILDS_REGION: ${{ vars.BUILDS_REGION }}
          BUILDS_AWS_KEY_ID: ${{ secrets.BUILDS_AWS_KEY_ID }}
          BUILDS_AWS_SECRET: ${{ secrets.BUILDS_AWS_SECRET }}
          CDN_DOMAIN: ${{ vars.CDN_DOMAIN }}
          CDN_KEY_PAIR_ID: ${{ vars.CDN_KEY_PAIR_ID }}
          CDN_PRIVATE_KEY: ${{ secrets.CDN_PRIVATE_KEY }}
          OCI_BUILDS_HOST: ${{ vars.OCI_BUILDS_HOST }}
          OCI_LINK_SECRET: ${{ secrets.OCI_LINK_SECRET }}
        run: |
          ref=$(jq -r .url supabase/project.json | sed -E 's#https://([^.]+)\..*#\1#')
          if [ -n "$UPLOAD_KEY" ]; then
            npx --yes supabase@2.120.0 secrets set --project-ref "$ref" UPLOAD_KEY="$UPLOAD_KEY"
          fi
          if [ -n "$BUILDS_BUCKET" ] && [ -n "$CDN_PRIVATE_KEY" ]; then
            # the private key goes in as one line ("\n" escapes); the download function restores it
            key_one_line=$(printf '%s' "$CDN_PRIVATE_KEY" | awk 'BEGIN{ORS="\\n"} {print}')
            npx --yes supabase@2.120.0 secrets set --project-ref "$ref" \
              BUILDS_BUCKET="$BUILDS_BUCKET" BUILDS_REGION="$BUILDS_REGION" \
              BUILDS_AWS_KEY_ID="$BUILDS_AWS_KEY_ID" BUILDS_AWS_SECRET="$BUILDS_AWS_SECRET" \
              CDN_DOMAIN="$CDN_DOMAIN" CDN_KEY_PAIR_ID="$CDN_KEY_PAIR_ID" CDN_PRIVATE_KEY="$key_one_line"
          fi
          if [ -n "$OCI_BUILDS_HOST" ] && [ -n "$OCI_LINK_SECRET" ]; then
            # the third download copy (Oracle Cloud server, handbook infra/)
            npx --yes supabase@2.120.0 secrets set --project-ref "$ref"               OCI_BUILDS_HOST="$OCI_BUILDS_HOST" OCI_LINK_SECRET="$OCI_LINK_SECRET"
          fi
          npx --yes supabase@2.120.0 functions deploy download source upload manifest \
            --project-ref "$ref" --no-verify-jwt --use-api
      - name: Save public settings
        run: |
          if [ -z "$(git status --porcelain -- supabase/project.json)" ]; then echo "No changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/project.json
          git commit -m "Community: save Supabase project settings"
          git pull --rebase -X theirs origin main
          git push

  publish:
    needs: setup
    uses: ./.github/workflows/publish.yml
