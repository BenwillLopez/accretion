name: Domain

# Keeps getaccretion.app's Cloudflare DNS equal to dns.json (scripts/dns.py). A push that changes
# dns.json applies it; the weekly run and manual runs without apply only check and fail on drift.
on:
  push:
    branches: [main]
    paths: [dns.json, scripts/dns.py]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      apply:
        description: Create and remove records to match dns.json
        type: boolean
        default: false

permissions:
  contents: read

concurrency: domain

jobs:
  dns:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Cloudflare DNS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/dns.py ${{ (github.event_name == 'push' || inputs.apply) && '--apply' || '' }}
