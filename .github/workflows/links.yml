name: Check links

# Manual link check. Every scheduled build (build.yml) already tests every link; run this to
# check right away.
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/publish.yml
    with:
      check_links: true
