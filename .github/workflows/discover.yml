name: Discover sources

# Weekly: look for new sources in link lists and on GitHub, then rebuild.
on:
  schedule:
    - cron: "41 3 * * 1"
  push:
    branches: [main]
    paths: [discover.json, "scripts/discover.py"]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/publish.yml
    with:
      discover: true
    secrets:
      GH_SEARCH_TOKEN: ${{ secrets.GH_SEARCH_TOKEN }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
