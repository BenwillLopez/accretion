name: Publish

# Shared pipeline behind build.yml, discover.yml and links.yml.
# Steps run in order: discover -> check links -> merge -> validate -> commit.
on:
  workflow_call:
    inputs:
      discover:
        type: boolean
        default: false
      check_links:
        type: boolean
        default: false
    secrets:
      GH_SEARCH_TOKEN:
        required: false
      FIREBASE_SERVICE_ACCOUNT:
        required: false

permissions:
  actions: write
  statuses: write
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      # main as it is now, not the commit that triggered the run, so runs never undo each other
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      # Scheduled rebuilds publish directly, so validate the checked-out code before using it.
      - name: Validate publishing code
        run: |
          pip install -q ruff==0.16.8 pillow==11.3.0 boto3==1.43.111 cryptography==46.0.3
          ruff check .
          ruff format --check .
          python -m unittest discover -s tests -q
          node --test tests/edge/*.test.cjs
          node --check site/app.js
          node --check site/social.js
          node --check site/sw.js

      # last good copy of every source, so a source that is down keeps its apps
      - uses: actions/cache@v4
        with:
          path: cache
          key: sources-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sources-

      - name: Discover sources
        if: inputs.discover
        run: python scripts/discover.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_SEARCH_TOKEN: ${{ secrets.GH_SEARCH_TOKEN }}

      - name: Check download links
        if: inputs.check_links
        run: python scripts/check_links.py

      - name: Merge and validate
        run: python scripts/merge.py

      # host every app icon on the store's own https address (blank/insecure icons in installers)
      - name: Host app icons
        run: |
          pip install -q "pillow==11.3.0"
          python scripts/icons.py

      # PNG copies of the stat cards for forums and chats that do not show SVG
      - name: Render PNG cards
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          python scripts/render_png.py

      # the store's public address, for the sitemap; works for any repo or custom domain
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Build web store
        run: python scripts/site.py
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          # Settings > Secrets and variables > Actions > Variables (public values)
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # A free mirror of the same web store on Firebase Hosting (accretion-72875.web.app), for when
      # GitHub Pages is down. Never fails the build; skipped while the deploy secret is missing.
      - name: Mirror to Firebase Hosting
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then echo "No FIREBASE_SERVICE_ACCOUNT secret; skipped."; exit 0; fi
          creds="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$creds"
          GOOGLE_APPLICATION_CREDENTIALS="$creds" npx --yes firebase-tools@15.33.0 deploy \
            --only hosting --project accretion-72875 --non-interactive --message "Store build ${GITHUB_SHA::7}"
          rm -f "$creds"

      - name: Summary
        run: cat REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="source.json curated.json stats.json history.json REPORT.md discovered.txt discovered.json dead_links.json link_dates.json assets/card-dark.svg assets/card-light.svg assets/recent-dark.svg assets/recent-light.svg assets/card-dark.png assets/recent-dark.png"
          existing=$(for f in $files; do if [ -e "$f" ]; then echo "$f"; fi; done)
          # skip commits that would only change the build time
          if [ -z "$(git status --porcelain -- source.json curated.json discovered.txt dead_links.json link_dates.json)" ]; then
            echo "No content changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- $existing
          git commit -m "${{ inputs.discover && 'Discover sources and rebuild' || inputs.check_links && 'Check links and rebuild' || 'Rebuild source' }}" -m "Co-Authored-By: Codex <noreply@openai.com>"
          python scripts/checked_push.py store

  # The web store. Needs Settings > Pages > Source: GitHub Actions (one time).
  # Until then this job fails on its own without failing the source build.
  pages:
    needs: publish
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
