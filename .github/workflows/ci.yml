name: CI

# Lint, unit tests and a validation pass over the published files.
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
  push:
    branches: [main]
    paths: ["scripts/**", "site/**", "supabase/**", "tests/**", pyproject.toml, ".github/workflows/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.8 pillow==11.3.0 boto3==1.43.111 cryptography==46.0.3
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m unittest discover -s tests -v
      - name: Check web store script
        run: node --check site/app.js
      # on pushes the publish workflow rebuilds and validates these itself
      - name: Validate published files
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: python scripts/validate.py source.json curated.json
      - name: Check community scripts
        run: node --check site/social.js && node --check site/sw.js

  database:
    # Applies supabase/schema.sql to a plain Postgres and runs the access-rule checks.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: psql -v ON_ERROR_STOP=1 -q -f supabase/auth_stub.sql
      - run: psql -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
      - name: Schema can be applied twice
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/test.sql

  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node --test tests/edge/*.test.cjs
      - run: npx --yes deno@2.9.6 check supabase/functions/download/index.ts supabase/functions/source/index.ts supabase/functions/upload/index.ts supabase/functions/manifest/index.ts
