name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.28.0"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        id: install-gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$archive"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "$archive" gitleaks
      - name: Scan new commits
        id: scan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          scan() { ./gitleaks git --redact --no-banner --exit-code 1 "$@" .; }
          case "$EVENT" in
            push)
              if [ -n "$BEFORE" ] && [ "${BEFORE//0/}" != "" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                scan --log-opts="$BEFORE..$SHA"
              else
                scan --log-opts="-1 $SHA"
              fi
              ;;
            pull_request)
              scan --log-opts="origin/$BASE_REF..HEAD"
              ;;
            *)
              scan
              ;;
          esac
      - name: Summary
        if: always()
        env:
          STEPS: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
          EVENT: ${{ github.event_name }}
        run: |
          failed=$(jq -r 'to_entries | map(select(.value.conclusion == "failure") | .key | gsub("-"; " ")) | join(", ")' <<< "$STEPS")
          {
            if [ "$JOB_STATUS" = success ]; then
              echo "### No secrets found in the new commits"
            else
              echo "### A possible secret was found"
              echo "Failed step: ${failed:-unknown}. The scan step above names the file and the rule (values are hidden). Remove it from the code, then change the real secret."
            fi
            echo
            echo "| Step | Result |"
            echo "| --- | --- |"
            jq -r 'to_entries[] | "| " + (.key | gsub("-"; " ")) + " | " + (.value.conclusion // "not run") + " |"' <<< "$STEPS"
            echo
            echo "| Fact | Value |"
            echo "| --- | --- |"
            echo "| Checked | $EVENT |"
          } >> "$GITHUB_STEP_SUMMARY"
