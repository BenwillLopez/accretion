name: Build source

# Rebuilds source.json from all sources so it always has the newest versions.
on:
  schedule:
    - cron: "23 */6 * * *"
  push:
    branches: [main]
    paths: [sources.txt, blocklist.txt, merge.py, common.py]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: altsource
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # main as it is now, not the commit that triggered the run, so runs never undo each other
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python merge.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Update source.json"
          git pull --rebase -X theirs origin main
          git push
