name: Build source

# Scheduled runs check every download link. Code/site pushes rebuild immediately;
# manual runs can opt into the slower link scan.
on:
  schedule:
    - cron: "23 */6 * * *"
  push:
    branches: [main]
    paths: [sources.txt, blocklist.txt, dead_hosts.txt, popular.txt, support.json, "scripts/**", "site/**"]
  workflow_dispatch:
    inputs:
      check_links:
        description: "Check download links before rebuilding (slower)"
        type: boolean
        default: false

permissions:
  actions: write
  statuses: write
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/publish.yml
    with:
      check_links: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.check_links) }}
