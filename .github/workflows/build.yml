name: Build source

# Every 6 hours: fetch all sources, test every download link, and publish the newest working
# version of every app.
on:
  schedule:
    - cron: "23 */6 * * *"
  push:
    branches: [main]
    paths: [sources.txt, blocklist.txt, dead_hosts.txt, popular.txt, support.json, "scripts/**", "site/**"]
  workflow_dispatch:

permissions:
  actions: write
  statuses: write
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/publish.yml
    with:
      check_links: true
