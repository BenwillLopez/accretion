name: Build source

# Every 6 hours: fetch all sources and publish the newest version of every app.
on:
  schedule:
    - cron: "23 */6 * * *"
  push:
    branches: [main]
    paths: [sources.txt, blocklist.txt, "scripts/merge.py", "scripts/sanitize.py", "scripts/common.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/publish.yml
